const P={A:{name:'炽热火焰型',emoji:'🔥',tagline:'爱就轰轰烈烈，不爱就干脆利落',desc:'你是感情里的行动派，喜欢一个人时会毫不掩饰地表达。你的热情像火焰一样能温暖周围的人，也容易在感情里全情投入。你敢爱敢恨，对待感情态度鲜明，不喜欢暧昧和拖泥带水。',love:'在恋爱中，你会主动制造惊喜和浪漫，愿意为对方付出很多。但有时候你的热情可能来得快去得也快，需要学会在激情褪去后依然用心经营。吵架时你容易冲动说狠话，但事后往往会后悔。',advice:'学会给感情降降温，有时候细水长流比轰轰烈烈更长久。在表达情绪前先深呼吸三秒，避免说出伤人的话。你的真诚和热情是最大的魅力，只要加上一点耐心，就能收获非常幸福的感情。',best:'温柔港湾型',warn:'自由风筝型'},B:{name:'温柔港湾型',emoji:'🌸',tagline:'你是别人的避风港，也是最需要被疼爱的人',desc:'你天生细腻敏感，善于察觉别人的情绪变化。你温柔体贴，总是把对方的需求放在前面，是大家公认的"暖男/暖女"。你追求稳定和安全感，不喜欢大起大落的感情，相信平平淡淡才是真。',love:'在恋爱中，你会无微不至地照顾对方，记得每一个纪念日和小习惯。你擅长倾听和包容，是非常理想的伴侣。但你有时候会过度付出，忽略了自己的感受，甚至在感情里失去自我。',advice:'温柔要有，但不是妥协。学会在感情里设立边界，敢于表达自己的真实需求。你对别人好的同时，也要对自己好一点。一个懂得爱自己的人，才能更好地爱别人，也会被别人更加珍惜。',best:'炽热火焰型',warn:'理性分析型'},C:{name:'理性分析型',emoji:'🧊',tagline:'连谈恋爱都要讲道理的逻辑大师',desc:'你是一个非常理性的人，做任何事情都喜欢分析利弊，包括感情。你不会轻易心动，但一旦认定一个人就会非常专一。你遇事冷静，不喜欢情绪化的争吵，相信任何问题都可以通过沟通解决。',love:'在恋爱中，你可能不太会说甜言蜜语，但会用实际行动证明自己的爱。你做事有条理，会规划两个人的未来。但有时候你过于理性，会让对方觉得你不够浪漫甚至有些冷漠。吵架时你喜欢讲道理，但对方可能只是想要一个拥抱。',advice:'感情不是辩论赛，不是所有事情都要分对错。学会偶尔"不讲理"一点，多说几句甜言蜜语，多给对方一些拥抱和惊喜。你的靠谱和稳重是很大的优点，加上一点感性和浪漫，会让你的感情更加甜蜜。',best:'浪漫梦幻型',warn:'温柔港湾型'},D:{name:'自由风筝型',emoji:'🕊️',tagline:'爱情诚可贵，自由价更高',desc:'你是一个热爱自由的人，不喜欢被束缚和限制。你有自己的兴趣爱好和社交圈，不会因为谈恋爱就放弃自己的生活。你追求轻松愉快的相处模式，讨厌黏人和查岗，相信好的感情应该是两个人各自精彩又彼此吸引。',love:'在恋爱中，你需要足够的个人空间，不喜欢天天腻在一起。你欣赏独立有个性的伴侣，不喜欢对方过度依赖你。但有时候你过于追求自由，会让对方觉得你不够在乎这段感情，甚至产生不安全感。',advice:'自由和爱情并不矛盾，关键在于找到平衡点。学会主动跟对方报备行踪，不是因为被要求，而是因为在乎。偶尔的黏人和依赖并不会让你失去自由，反而会让感情更加亲密。给对方足够的安全感，你才能拥有更多的自由。',best:'默默守护型',warn:'炽热火焰型'},E:{name:'默默守护型',emoji:'🌙',tagline:'不说爱你，但每件事都在说爱你',desc:'你是一个内敛深沉的人，不擅长用语言表达感情，但行动力十足。你相信"说的好听不如做的实在"，会用实际行动默默守护对方。你踏实可靠，虽然不浪漫，但给人满满的安全感，是那种"润物细无声"的类型。',love:'在恋爱中，你可能不会说"我爱你"，但会在对方生病时端茶倒水，在对方遇到困难时第一时间出现。你记得对方的喜好，会在不经意间给对方惊喜。但有时候你过于沉默，会让对方猜不透你的心思，甚至怀疑你是不是不够爱。',advice:'爱要大声说出来，行动很重要，语言也不可少。学会表达自己的感受，哪怕只是一句简单的"我想你了"。偶尔制造一些小浪漫，不需要多昂贵，关键是让对方感受到你的心意。你的默默付出很珍贵，让对方知道会更加幸福。',best:'自由风筝型',warn:'浪漫梦幻型'},F:{name:'浪漫梦幻型',emoji:'✨',tagline:'在爱情里，你永远是那个追光的人',desc:'你是一个浪漫主义者，对爱情有着美好的憧憬和期待。你喜欢仪式感，相信爱情应该是甜蜜而梦幻的。你想象力丰富，善于制造浪漫氛围，跟你在一起永远不会觉得无聊。你追求灵 let cq=0,sc={A:0,B:0,C:0,D:0,E:0,F:0};
function startTest(){cq=0;sc={A:0,B:0,C:0,D:0,E:0,F:0};showPage('page-quiz');rq();}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function rq(){const q=Q[cq];document.getElementById('question-num').textContent='第 '+(cq+1)+' 题 / 共 '+Q.length+' 题';document.getElementById('question-text').textContent=q.q;document.getElementById('progress-fill').style.width=((cq)/Q.length*100)+'%';const c=document.getElementById('options-container');c.innerHTML='';const L=['A','B','C','D'];q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<span class="option-letter">'+L[i]+'</span>'+opt.t;b.onclick=()=>so(i,opt.s);c.appendChild(b);});}
function so(i,s){const os=document.querySelectorAll('.option');os.forEach((o,j)=>{if(j===i)o.classList.add('selected');});for(let k in s){sc[k]+=s[k];}setTimeout(()=>{cq++;if(cq<Q.length){rq();}else{sr();}},250);}
function sr(){let mx=0,rk='A';for(let k in sc){if(sc[k]>mx){mx=sc[k];rk=k;}}const p=P[rk];document.getElementById('result-emoji').textContent=p.emoji;document.getElementById('result-type').textContent=p.name;document.getElementById('result-tagline').textContent=p.tagline;document.getElementById('result-desc').textContent=p.desc;document.getElementById('result-love').textContent=p.love;document.getElementById('result-advice').textContent=p.advice;document.getElementById('match-best').textContent=p.best;document.getElementById('match-warn').textContent=p.warn;showPage('page-result');}
function restartTest(){startTest();}
